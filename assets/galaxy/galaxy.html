window.__rebuildColors = function(){
  const P=window.GPARAMS;

  // 場景未建完前呼叫會 ReferenceError。就緒旗標由場景建構尾部設置。
  if(!window.__sceneReady) return;
  const hex2int=h=>{
    if(typeof h==='number') return h|0; // [v234b] Dart 端傳 int（Color.value）
    const v=parseInt(String(h).replace('#',''),16);
    return isNaN(v)?0xFF9E6B:v;
  };
  // ① 檔案星色表
  EXT_COLOR['.jpg']=EXT_COLOR['.jpeg']=EXT_COLOR['.png']=EXT_COLOR['.heic']=EXT_COLOR['.gif']=hex2int(P.colImg);
  ['.md','.pdf','.adoc','.doc','.txt'].forEach(e=>EXT_COLOR[e]=hex2int(P.colDoc));
  ['.js','.json','.html','.dart','.sol','.ts'].forEach(e=>EXT_COLOR[e]=hex2int(P.colCode));
  ['.csv','.xlsx','.spec'].forEach(e=>EXT_COLOR[e]=hex2int(P.colData));
  EXT_COLOR['x']=hex2int(P.colOther);
  // ② 記憶性質色覆蓋——兩種形式：subColors 子表（舊）或攤平 key subColor.xxx（v237）
  if(P.subColors) for(const [k,v] of Object.entries(P.subColors)) SUB_HUE[k]=hex2int(v);
  for(const k of Object.keys(P)){
    if(k.startsWith('subColor.')){ SUB_HUE[k.slice(9)]=hex2int(P[k]); }
  }
  // ③ 重算星色 buffer（亮度邏輯照舊）
  try{
    assets.forEach((a,i)=>{
      const c=new THREE.Color(EXT_COLOR[a.e] ?? EXT_COLOR['x']);
      const lum=Math.min(1, Math.log10(1+(a.s||1000))/7);
      starCol[i*3]=Math.min(1,c.r*Math.max(.45,lum)*1.25);
      starCol[i*3+1]=Math.min(1,c.g*Math.max(.45,lum)*1.25);
      starCol[i*3+2]=Math.min(1,c.b*Math.max(.45,lum)*1.25);
    });
    sg.attributes.color.needsUpdate=true;
  }catch(e){}
  // ④ 光球（hub）重染——tintGlow 快取清空+換貼圖
  try{
    tintGlow._c={}; // 清快取
    hubSprites.forEach(sp=>{
      const nd=nodeData[sp.userData.__nodeIdx];
      if(!nd)return;
      // [v237] 兩層都重染（bub 柔光層+core 自體光層）——改性質色要全套變
      if(sp.material && sp.material.map){
        const useDyn = window.__glowGradKey !== undefined;
        sp.material.map = useDyn ? tintGlowDyn(subColor(nd)) : tintGlow(subColor(nd));
        sp.material.needsUpdate=true;
      }
    });
  }catch(e){}
  // ⑤ 縫線顏色——threadMat 的 baseW/boostW 是寬度；色在頂點色或 uniform：
  try{
    // [v234] 縫線選色：所有 ribbon 材質×uTint（原紫 #B28DFF → 目標）
    const orig=new THREE.Color(0xB28DFF), tgt=new THREE.Color(hex2int(P.colThread));
    const tint=new THREE.Color(Math.min(4,tgt.r/Math.max(.02,orig.r)), Math.min(4,tgt.g/Math.max(.02,orig.g)), Math.min(4,tgt.b/Math.max(.02,orig.b)));
    for(const mk of ['__threadMat','__fileLineMat']){
      const m=window[mk];

    if(window.__renderLegend) window.__renderLegend();

};

window.__gparamApply = function(){
  try{
    const P=window.GPARAMS;
    // A: 自轉/像素比
    if(typeof spin!=='undefined'){ spin.vy = P.spinOn ? P.spinSpeed : 0; }
    if(typeof renderer!=='undefined' && renderer.getPixelRatio()!==P.pixelRatio){ renderer.setPixelRatio(Math.min(P.pixelRatio, devicePixelRatio)); }
    // B: 呼吸/流光（材質 uniforms）
    if(window.__causalMat){ window.__causalMat.uniforms.uPulseSpd.value=P.breatheSpd; window.__causalMat.uniforms.uPulseAmp.value=P.breatheAmp; }
    if(window.__taskMat){ window.__taskMat.uniforms.uPulseSpd.value=P.breatheSpd*0.75; }
    // D: 音訊（playTone 讀 GPARAMS）
    // [v236] C 群即時：記憶球尺寸/核心比例（scale 直接乘）
    if(window.__sceneReady && window.__hubBaseScale===undefined){
      window.__hubBaseScale = hubSprites.map(sp=>sp.scale.x);
    }
    if(window.__sceneReady && window.__hubBaseScale){
      const _hs=P.hubScale, _hc=P.hubCore;
      hubSprites.forEach((sp,i)=>{
        const base=window.__hubBaseScale[i];
        if(base==null)return;
        sp.scale.setScalar(sp.userData.__isBub ? base*_hs : base*_hc);
      });
    }
    // [v236] F 群即時：光球貼圖漸層（glowEdge/glowCore）＋柔光/自體光強度
    if(window.__sceneReady){
      const _ec=P.glowEdge, _co=P.glowCore;
      const _key=_ec.toFixed(3)+'|'+_co.toFixed(3);
      if(window.__glowGradKey!==_key){
        window.__glowGradKey=_key;
        window.__origTintStops=[0.7,0.85,1.0]; // v185 原廠
        // 動態改 tintGlow：清快取後重繪（讀參數的漸層版）
        tintGlow._c={};
        window.__glowEdgeW=_ec; window.__glowCoreW=_co;
        hubSprites.forEach(sp=>{
          const nd=nodeData[sp.userData.__nodeIdx];
          if(!nd)return;
          sp.material.map=tintGlowDyn(subColor(nd));
          sp.material.needsUpdate=true;
        });
      }
      // [v284 收權令] 柔光/自體光倍率只改參數——亮度由 lightAuthority 每幀
      // 統一套用（原直寫 opacity 與 LOD 打架=全景閃屏真兇）
    }
    // [v236] G 群即時：river 模式中的三倍率即時重套
    if(window.__sceneReady && typeof VIZ!=='undefined' && VIZ.mode==='river' && riverSavedOpacity){
      /* [v284 收權令] river hub 亮度=lightAuthority 誕生時序管理 */
      riverSavedOpacity.lines.forEach(([obj,orig])=>{
        if(obj.material&&obj.material.uniforms&&obj.material.uniforms.uOpacity)
          obj.material.uniforms.uOpacity.value=orig*P.riverLine; // orig=進river前的原值
      });
      if(riverSavedOpacity.instColor && inst && inst.instanceColor){
        const dim=inst.instanceColor.array;
        for(let q=0;q<dim.length;q++) dim[q]=riverSavedOpacity.instColor[q]*P.riverStar;
        inst.instanceColor.needsUpdate=true;
      }
    }
    // [v234] 顏色即時預覽——變色需重建貼圖+材質。偵測色值變更後觸發重建。
    if(window.__gparamColors === undefined) window.__gparamColors = {};
    const _colKeys=['colImg','colDoc','colCode','colData','colOther','colThread','colGold'];
    window.__colKeys=_colKeys;
    let _colChanged=false;
    for(const k of _colKeys){
      if(window.__gparamColors[k]!==P[k]){ _colChanged=true; window.__gparamColors[k]=P[k]; }
    }
    if(_colChanged && window.__rebuildColors){
      window.__rebuildColors(); // 重建星色/縫線色（v234 實作）
    }
  }catch(e){}
};

// ── 房間=星團 ──
// [Blue 宇宙定位令 v111] 星系佈局改 seeded random——每次開啟都是同一個宇宙
// （原本 Math.random 每次開啟房間方位/球散佈都不同=「變形」感的真兇）
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const COSMOS_SEED = 20260830; // 宇宙種子（改這個數字=換一個宇宙）
const cosmosRng = mulberry32(COSMOS_SEED);
const ROOM_COLOR = {doors:0x5fb8ff, stream:0x9d7bff, pendulums:0xff8a5f, heartMind:0xff6f9c, fraile:0x66e0c3};
const roomCenter = {};
// [Blue 均衡星系令 v113] 大方向均衡：五房間角度均分 72°（圓桌）+ seeded
// 抖動 ±18°（自然感）、高度交錯（-260~+260 弧形起伏）、半徑微變化——
// 自轉時任何角度看都是均衡的星系，不會偏一邊
{
  const rooms=Object.keys(ROOM_COLOR);
  const jitter=(i)=>(cosmosRng()-.5)*36*Math.PI/180; // ±18°
  const yArc=i=>Math.sin(i/rooms.length*Math.PI*2)*260; // 弧形起伏
  const rVar=i=>820+cosmosRng()*120; // 820~940
  rooms.forEach((room,i)=>{
    const th=i/rooms.length*Math.PI*2 + jitter(i);
    const r=rVar(i);
    roomCenter[room]=[Math.cos(th)*r, yArc(i), Math.sin(th)*r];
  });
}
const colorOf = n => ROOM_COLOR[n.room] ?? 0x9fb4a6;

  window.olog&&window.olog('wheel',{dy:e.deltaY,x:e.clientX,y:e.clientY,cam:camSnap()});
  const rect=renderer.domElement.getBoundingClientRect();

const TOTAL_STARS=allEvents.length;
// [Blue 視覺反饋令 v96] 視覺權重累積曲線：記憶球(大光球)=30、檔案星=1
// 播放以「每秒固定視覺權重」推進——畫面越豐富自動越慢（視覺打敗視覺）
const visW=new Float64Array(allEvents.length+1);
allEvents.forEach((e,r)=>{ visW[r+1]=visW[r]+(e.mem!==undefined?30:1); });

const wOfU=u=>{ // [v288] 進度 u → 視覺權重（進度條跳轉用——uOfW 反函數）
  const x=Math.max(0,Math.min(allEvents.length-1, u*(allEvents.length-1)));
  const k=Math.min(allEvents.length-1, Math.floor(x));
  return visW[k]+(visW[k+1]-visW[k])*(x-k);
};
const uOfW=w=>{ // 視覺權重 → 進度 u（二分搜）
  let lo=0,hi=allEvents.length;
  while(lo<hi){const mid=(lo+hi)>>1; if(visW[mid]<w)lo=mid+1; else hi=mid;}
  const r=Math.max(0,Math.min(allEvents.length-1,lo-1));
  const seg=visW[lo]-visW[lo-1]||1;
  return (r+(w-visW[lo-1])/seg)/(allEvents.length-1||1);
};

  return u*(TOTAL_STARS-1);

  const x=Math.max(0,Math.min(TOTAL_STARS-1, u*(TOTAL_STARS-1)));
  const k=Math.min(TOTAL_STARS-2, Math.floor(x));

};

<div id="xiaokui-float" style="position:fixed;right:24px;bottom:24px;width:200px;height:200px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .8s"></div>
<script src="avatar_engine.js"></script>
<script>
(function(){
  const host = document.getElementById('xiaokui-float');
  let shown = false;
  // 星系就緒後掛引擎
  const t = setInterval(()=>{
    if(!window.__galaxyReady || !window.AvatarEngine) return;
    clearInterval(t);
    try{
      host.appendChild(AvatarEngine.canvas);
      AvatarEngine.canvas.style.cssText = 'width:100%;height:100%;';
      AvatarEngine.load().then(()=>{
        host.style.opacity = '1';
        shown = true;
      });
    }catch(e){}
  }, 500);
  // 對話狀態信號也走 galaxy_cmd：op:'avatar' 帶 §13 訊號
  const _cmd = window.__galaxyCmd;
  window.__galaxyCmd = function(c){
    if(c && c.op === 'avatar' && window.AvatarEngine){
      AvatarEngine.signal({state:c.state, loops:c.loops, then:c.then});
      if(c.voice != null) AvatarEngine.setVoiceActive(!!c.voice);
      return {ok:true};
    }
    return _cmd ? _cmd(c) : {ok:false};
  };
})();
</script>
</body></html>
