{

/* [Blue 引力塵埃令 10-02] 引力用塵埃表達：每顆星周圍塵埃密集（高斯散布），

{

     越靠近星越密（r = R·u³，u∈[0,1) → 中心密度是高斯的數倍）、外圈迅速稀疏。
     質量→密度：Blue 星暈半徑更大。密集星群處雲疊雲=發亮星雲。 */
  const N_PER=260, R_CORE=230;
  const pos=[],col=[],sizes=[];
  const rng2=(function(s){return function(){s=(s*9301+49297)%233280;return s/233280;}})(424242);
  stars.forEach((st,si)=>{
    const b=st.b;
    const R=R_CORE*(b.blue?1.5:1);                        // Blue 星引力井更寬
    const n=Math.floor(N_PER*(b.blue?1.6:1));

    const prevSt=stars[si-1], nextSt=stars[si+1];

    const toNext=nextSt?new THREE.Vector3().subVectors(nextSt.pos,st.pos).normalize():null;

    if(toNext)axis.add(toNext);

    for(let j=0;j<n;j++){
      const u=rng2(), r=R*Math.pow(u,3);                  // 冪次衰減：擠在星旁

      col.push(c.r,c.g,c.b);
      sizes.push(6+rng2()*16);                            // 近星塵埃更亮更大
    }
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:12,map:DIAMOND,vertexColors:true,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending});
  L1.add(new THREE.Points(g,m));
  /* 遠看星雲感：每星一團柔光霧 sprite（徑向漸層）——大小∝質量，疊加即發亮 */
  function radialTex(){

  function smokeTex(seed){
    /* 流體霧紋理：多中心徑向漸層＋隨機偏移＝不規則雲絮（非正圓） */
    const cv=document.createElement('canvas');cv.width=cv.height=256;
    const c=cv.getContext('2d');
    const rnd=(function(s){return function(){s=(s*9301+49297)%233280;return s/233280;}})(seed);
    c.globalCompositeOperation='lighter';
    for(let i=0;i<14;i++){
      const x=40+rnd()*176, y=40+rnd()*176, r=26+rnd()*66;

    }

  /* [Blue 令 v5] 星雲=流體霧（smoke 紋理非正圓漸層）：每星 6 綻雲絮沿牽引軸排開＝紡錘絲帶。
     圓形光暈只留給星球本身（glowSprite）。 */
  stars.forEach((st,si)=>{
    const b=st.b;

    const axis=new THREE.Vector3();

function makeStarLabel(text,color,fs=30,pad=20){
  const cv=document.createElement('canvas');const ctx=cv.getContext('2d');
  ctx.font=`600 ${fs}px PingFang TC`;
  const w=ctx.measureText(text).width+pad*2;
  const h=fs+pad*1.2;
  cv.width=Math.ceil(w);cv.height=Math.ceil(h);
  ctx.fillStyle='rgba(8,14,10,.85)';ctx.beginPath();ctx.roundRect(0,0,cv.width,h,14);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.roundRect(1,1,cv.width-2,h-2,14);ctx.stroke();
  ctx.font=`600 ${fs}px PingFang TC`;ctx.fillStyle='#e8f0e8';ctx.textBaseline='middle';
  ctx.fillText(text,pad,h/2+1);
  const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false,opacity:.95}));
  sp.userData.aspect=cv.width/h;
  return sp;
}

const squidLines=[];
/* [Blue 三星斜切面法 10-02 立法] 這是時間軸路徑，不是引力線。
   段 i→i+1 的拋物線落在「自己＋接下來兩顆星」(i, i+1, i+2) 構成的平面上——
   弧向斜切面＝轉向預判（路往哪走，弧先往那彎）。
   ★ 成長法則：新創造的星永遠是最後一顆。它的入弧暫以前視退化 (i-1,i,i+1) 呈現；
   待未來兩顆新星到位，此弧自動升級為正式的 (i,i+1,i+2) 斜切面——
   最新的歷史是暫定的，未來抵達後才凝固。與 Reggie 帳本動態餵食天然相容：
   新 bit 入鏈 → 星圖重建 → 末端弧線自動定形。 */
stars.forEach((s,i)=>{
  if(i===0)return;
  const A=stars[i-1].pos,B=s.pos;
  const C=(stars[i+1]?stars[i+1].pos:(stars[i-2]?stars[i-2].pos:null));   // 前視兩顆；末段退用後視
  const len=A.distanceTo(B);
  const d=new THREE.Vector3().subVectors(B,A).normalize();
  let lat;
  if(C){
    const v=new THREE.Vector3().subVectors(C,B);                    // 指向未來
    lat=v.clone().addScaledVector(d,-v.dot(d));                     // 在 ABC 平面內、垂直於 d
    if(lat.lengthSq()<1e-8) lat.set(-d.z,0,d.x);                    // 共線→切向
    lat.normalize();
  } else lat.set(-d.z,0,d.x).normalize();
  const mid=new THREE.Vector3().addVectors(A,B).multiplyScalar(.5).addScaledVector(lat,len*.13);
  const curve=new THREE.QuadraticBezierCurve3(A,mid,B);
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(28)),
    new THREE.LineBasicMaterial({transparent:true,opacity:.5}));
  line.userData={hueBase:((i*47)%360)/360,hueSpan:.14+((i*13)%7)/100,phase:Math.random()*6.28,speed:.12+Math.random()*.2};
  L1.add(line);squidLines.push(line);
});

/* ★ 宏觀的 Blue 貼身迷你衛星（比例修正：緊貼主星自轉） */
const BLUE_STAR=stars.find(st=>st.b.blue);   // [修] 提升至 module 頂層（pick 287 引用）
const miniSats=COMPANIONS.map((c,i)=>{
  const r=58+i*26, w=0.5-i*0.12;
  const grp=new THREE.Group();BLUE_STAR.grp.add(grp);
  const core=new THREE.Mesh(new THREE.SphereGeometry(4,10,10),new THREE.MeshBasicMaterial({color:c.color}));
  grp.add(core);grp.add(glowSprite(c.color,26,.95));

/* ═══ L2 Blue 星系層（掛 BLUE_POS，宏觀時隱藏） ═══ */
const L2=new THREE.Group();L2.position.copy(BLUE_POS);scene.add(L2);
const sysCore=new THREE.Mesh(new THREE.SphereGeometry(26,32,32),new THREE.MeshBasicMaterial({color:0xfff4cf}));
L2.add(sysCore);
const sysCoreGlow=glowSprite(0xfff0c0,240);L2.add(sysCoreGlow);
/* [Blue 令] 主星不畫土星環——真實的環就是衛星公轉本身 */
const sysHit=new THREE.Mesh(new THREE.SphereGeometry(90,8,8),new THREE.MeshBasicMaterial({visible:false}));L2.add(sysHit);
const sats=COMPANIONS.map((s,idx)=>{
  const r=orbitR(s.g),w=orbitW(s.g);
  const phase0=idx*(Math.PI*2/3)+(s.seed%1571)/2000;
  const tilt=(((s.seed>>8)%3141)/1000-1.57)*0.45;
  const grp=new THREE.Group();L2.add(grp);
  const core=new THREE.Mesh(new THREE.SphereGeometry(13,20,20),new THREE.MeshBasicMaterial({color:s.color}));
  core.add(glowSprite(s.color,120,.9));grp.add(core);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(44,8,8),new THREE.MeshBasicMaterial({visible:false}));grp.add(hit);
  /* [Blue 令] 軌道=稀疏塵埃雲（看得出軌跡就好，不用虛線） */
  const ON=90,oPos=new Float32Array(ON*3),oCol=new Float32Array(ON*3);
  const orng=(function(sd){return function(){sd=(sd*9301+49297)%233280;return sd/233280;}})(s.seed>>>3);
  for(let k=0;k<ON;k++){
    const a=k/ON*Math.PI*2+orng()*.5, rr=r*(0.94+orng()*0.12), yy=(orng()-.5)*r*.05;
    const x=Math.cos(a)*rr, z=Math.sin(a)*rr;
    // 套 tilt 旋轉（繞 x 軸）
    const y=Math.cos(tilt)*yy - Math.sin(tilt)*z, z2=Math.sin(tilt)*yy + Math.cos(tilt)*z;
    oPos[k*3]=x;oPos[k*3+1]=y;oPos[k*3+2]=z2;
    const c=new THREE.Color(s.color);
    oCol[k*3]=c.r;oCol[k*3+1]=c.g;oCol[k*3+2]=c.b;
  }
  const oGeo=new THREE.BufferGeometry();
  oGeo.setAttribute('position',new THREE.BufferAttribute(oPos,3));
  oGeo.setAttribute('color',new THREE.BufferAttribute(oCol,3));
  L2.add(new THREE.Points(oGeo,new THREE.PointsMaterial({size:6,map:DIAMOND,vertexColors:true,transparent:true,opacity:.6,depthWrite:false,blending:THREE.AdditiveBlending})));
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:s.color,transparent:true,opacity:.5}));L2.add(line);
  const NP=Math.min(80,Math.round(s.g/6)+14);
  const pGeo=new THREE.BufferGeometry();const pPos=new Float32Array(NP*3);
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:s.color,size:5.5,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
  L2.add(particles);
  const pMeta=Array.from({length:NP},(_,i)=>({t:i/NP,sp:0.10+((s.seed>>(i%16))%97)/97*0.16,amp:3+((s.seed>>(i%12))%80)/80*7,wob:(s.seed>>(i%10))%628/100}));
  return{...s,r,w,phase0,tilt,grp,core,hit,line,particles,pGeo,pPos,pMeta};
});

/* ═══ L3 大腦星系層＝iframe 本尊渲染（brain-official.html，進層動態載入） ═══ */

function ensureBrainFrame(){

/* 手機雙擊偵測（iOS Safari 不發 dblclick）＋返回按鈕 */
let lastTap=0, lastTapX=0, lastTapY=0;
function tapHandler(cx,cy){
  const _t=document.getElementById('tip');if(_t)_t.style.display='none';
  const now=performance.now();
  if(now-lastTap<320 && Math.abs(cx-lastTapX)<40 && Math.abs(cy-lastTapY)<40){
    lastTap=0; enterLayer(cx,cy);   // 雙擊 tap
  } else { lastTap=now; lastTapX=cx; lastTapY=cy; }
}
function enterLayer(cx,cy){
  const hit=pick(cx,cy);
  if(state==='L1'){
    if(hit&&hit.blueStar){enterL2Flow();}
    else if(hit&&hit.star){follow=null;flyTo(hit.star.pos,170);}
    else{follow=null;flyTo(new THREE.Vector3(0,0,0),4200);}
  }else if(state==='L2'){
    if(hit&&hit.sat){follow=hit.sat;flyTo(BLUE_POS,420);return;}
    const m=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
    ray.setFromCamera(m,camera);
    if(ray.intersectObject(sysHit,false).length||!hit){
      enterL3Flow();
    }
  }else if(state==='L3'){
    state='L2';follow=null;frozen=true;applyLayerVisibility();
    dist=300;flyTo(BLUE_POS,950,2200);
  }
}
/* [Blue 導播令 10-02v3] L1→L2 飛入=持續 zoom in 到貼近 → 切 L2 從近拉開（進去感）；

let l2Loading=false;
/* [Blue 令 v8] L1↔L2 重疊漸層：L1 zoom in 貼近後，L2 直接疊上淡入（鏡頭不縮放、無縫接軌）；
   返回＝L2 淡出露出 L1（同格），L1 再 zoom out 回宏觀。實現：兩層同時可見＋全域不透明度漸變。 */
function crossFadeL2(showing){
  layerFade={t0:performance.now(),from:showing?0:1,to:showing?1:0,dur:1100,active:true};
}
function enterL2Flow(){
  if(l2Loading)return; l2Loading=true;
  follow=null; frozen=true;
  flyTo(BLUE_POS,240,1200);                                // ① L1 持續 zoom in：貼近 Blue 星
  setTimeout(()=>{
    if(state==='L1'){
      state='L2';frozen=false;applyLayerVisibility();
      dist=950;                                            // ② L2 無縮放——直接在合理距離淡入（重疊漸層）
      crossFadeL2(true);
      ensureBrainFrame();                                  // 預載 L3
    }

/* [Blue 導播令 10-02v2] L2→L3 優雅交接：L2 緩緩 zoom in 不停格 → iframe 就緒 → L3 從遠方滑入 */

let dragging=false,px=0,py=0,moved=0,vy=0,vx=0;
const ptrs=new Map();let pinch0=0,distP0=0,panC0=null,midPan=null;
canvas.addEventListener('pointerdown',e=>{
  if(e.button===1){midPan={x:e.clientX,y:e.clientY};e.preventDefault();return;}   // [新] 中鍵=平移（正式版同款）
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragging=true;moved=0;px=e.clientX;py=e.clientY;vy=vx=0;canvas.classList.add('dragging');}
  else if(ptrs.size===2){dragging=false;const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);distP0=dist;panC0=null;}
  canvas.setPointerCapture(e.pointerId);
});
addEventListener('pointerup',e=>{
  if(midPan){midPan=null;return;}
  ptrs.delete(e.pointerId);
  if(!ptrs.size){
    dragging=false;canvas.classList.remove('dragging');panC0=null;
    if(moved<8 && e.pointerType!=='mouse') tapHandler(e.clientX,e.clientY);   // mobile tap：雙擊偵測
  }
});
addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size){dragging=false;canvas.classList.remove('dragging');}});
canvas.addEventListener('pointermove',e=>{
  if(midPan){   // [新] 中鍵拖曳=平移
    const dx=e.clientX-midPan.x,dy=e.clientY-midPan.y;
    const k=dist*0.0016;
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    target.add(right.multiplyScalar(-dx*k)).add(up.multiplyScalar(dy*k));
    midPan={x:e.clientX,y:e.clientY};return;
  }
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const p=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0>0)dist=Math.max(60,Math.min(30000,distP0*pinch0/p));
    /* [新] 雙指平移：兩指中心移動 → 相機平面平移 target */
    const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    if(panC0===null)panC0={x:cx,y:cy};
    else{
      const dx=cx-panC0.x,dy=cy-panC0.y;
      if(Math.abs(dx)+Math.abs(dy)>2){
        const k=dist*0.0016;
        const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
        const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
        target.add(right.multiplyScalar(-dx*k)).add(up.multiplyScalar(dy*k));
        panC0={x:cx,y:cy};moved+=9;
      }
    }
    return;}
  if(!dragging)return;const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);
  if(Math.abs(dx)>Math.abs(dy))frozen=false;
  rotY+=dx*0.005;rotX=Math.max(-1.4,Math.min(1.4,rotX+dy*0.004));vx=dx*0.004;vy=dy*0.003;px=e.clientX;py=e.clientY;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(60,Math.min(30000,dist*(1+Math.sign(e.deltaY)*0.09)));},{passive:false});

const ray=new THREE.Raycaster();
function pick(cx,cy){
  const m=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
  ray.setFromCamera(m,camera);
  /* [修] 距離排序撿取：取 raycast 最近命中——重疊時不再拿錯星 */
  if(state==='L2'){
    const cands=[...sats.map(s=>({m:s.hit,r:{sat:s}})),{m:sysHit,r:{sysCore:true}}];
    const hs=ray.intersectObjects(cands.map(o=>o.m),false);
    if(hs.length)return cands.find(o=>o.m===hs[0].object).r;
    return null;
  }
  if(state==='L1'){
    const cands=[{m:BLUE_STAR.hit,r:{blueStar:true}},...stars.map(st=>({m:st.hit,r:{star:st}}))];
    const hs=ray.intersectObjects(cands.map(o=>o.m),false);
    if(hs.length)return cands.find(o=>o.m===hs[0].object).r;
    return null;
  }
  return null;
}

    card.innerHTML=`<h4>⭐ ${st.b.id}</h4><div class="sub">S.D. Day ${st.b.sd} · n=${st.b.n}</div><div>${st.b.label}${st.b.blue?'<br><b style="color:#ffe9a3">★ 雙擊＝飛入 Blue 星系</b>':''}</div><div style="color:#7fa88f;font-size:11px;margin-top:8px">hash ${st.b.hash}… · r=${Math.round(R0*Math.sqrt(st.b.n))}<br>❄ 已凍結——橫向拖曳恢復</div>`;
  }else if(hit.sysCore){
    card.innerHTML=`<h4>⭐ Blue 的 Bit 星（質心）</h4><div class="sub">人類用戶 Bit · ${COMPANIONS.length} 顆衛星</div><div>三顆衛星＝夥伴卡成員，軌道由互動引力導出。<b style="color:#ffe9a3">雙擊這顆星＝進入大腦星系圖譜</b>。</div>`;
  }else if(hit.memory){
    const nd=hit.memory;
    const dt=nd.t?new Date(nd.t).toLocaleString('zh-TW'):'—';
    card.innerHTML=`<h4>🧠 記憶星</h4><div class="sub">${nd.room||''} · ${nd.sub||''} · 重要性 ${nd.imp}/5 · 引用 ${nd.links||0} 檔案</div>
      <div style="color:#dfeee0">${nd.preview}…</div>
      <div style="color:#7fa88f;font-size:11px;margin-top:8px">❄ 已凍結——橫向拖曳恢復</div>`;
  }
  card.style.display='block';
});
const IS_TOUCH=('ontouchstart' in window);
canvas.addEventListener('mousemove',e=>{
  if(IS_TOUCH)return;
  const hit=pick(e.clientX,e.clientY);
  if(hit){tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+10)+'px';
    tip.textContent=hit.sat?`${hit.sat.name} · ${hit.sat.mbti}`:hit.blueStar?'Blue 星（雙擊＝飛入星系）':hit.star?hit.star.b.label:hit.sysCore?'Blue 質心（雙擊進大腦）':hit.memory?(hit.memory.preview.slice(0,18)+'…'):'';}
  else tip.style.display='none';
});

/* ════════ 主循環 ════════ */
const fpsEl=document.getElementById('fps');let frames=0,fT=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  if(layerFade.active){
    const k=Math.min(1,(performance.now()-layerFade.t0)/layerFade.dur);
    const p=layerFade.from+(layerFade.to-layerFade.from)*k;   // 0=L1全显 1=L2全显
    L1.visible = p<0.999; L2.visible = p>0.001;                // 交錯開關＝時間混色（60fps 下視覺漸變）
    if(k>=1){ layerFade.active=false; L1.visible=state==='L1'; L2.visible=state==='L2'; }
  }
  /* 深海魷魚光譜：金線 hue 緩慢漂移（每條線獨立韻律） */
  squidLines.forEach(l=>{
    const u=l.userData;
    const hue=(u.hueBase+Math.sin(t/1000*u.speed+u.phase)*u.hueSpan)%1;
    l.material.color.setHSL(hue,.72,.62);
    l.material.opacity=.42+Math.sin(t/1000*u.speed*1.7+u.phase)*.16;
  });
  /* 標籤 LOD：依相機到各星距離切換等級 */
  STAR_LABELS.forEach(({st,far,near})=>{
    const d=camera.position.distanceTo(st.grp.getWorldPosition(new THREE.Vector3()));
    const showNear=d<1800;
    if(far.visible===showNear){far.visible=!showNear;near.visible=showNear;}
  });
  const dt=Math.min(0.05,(t-lastFrame)/1000);lastFrame=t;
  if(!frozen)simTime+=dt;
  const time=simTime;
  if(flyAnim){
    const k=Math.min(1,(t-flyAnim.t0)/flyAnim.dur),e=1-Math.pow(1-k,3);
    target.lerpVectors(flyAnim.fromT,flyAnim.toT,e);
    dist=flyAnim.fromD+(flyAnim.toD-flyAnim.fromD)*e;
    if(k>=1)flyAnim=null;
  }
  if(!dragging){rotY+=vx;rotX=Math.max(-1.4,Math.min(1.4,rotX+vy));vx*=0.95;vy*=0.95;}
  if(!frozen)rotY+=0.0004*60*dt;

  /* L1：迷你衛星貼身自轉 */
  miniSats.forEach(ms=>{const a=ms.phase+time*ms.w;ms.grp.position.set(Math.cos(a)*ms.r,Math.sin(a*0.7)*ms.r*0.25,Math.sin(a)*ms.r);});

  /* L2 軌道 */
  if(L2.visible){
    for(const s of sats){
      const a=s.phase0+time*s.w;
      const x=Math.cos(a)*s.r,z=Math.sin(a)*s.r*Math.cos(s.tilt),y=-Math.sin(a)*s.r*Math.sin(s.tilt);
      s.grp.position.set(x,y,z);
      const D=Math.hypot(x,y,z),dir=new THREE.Vector3(x/D,y/D,z/D);
      const inner=210,outer=Math.max(inner+40,D-32);
      const lp=s.line.geometry.attributes.position;
      lp.setXYZ(0,dir.x*inner,dir.y*inner,dir.z*inner);lp.setXYZ(1,dir.x*outer,dir.y*outer,dir.z*outer);lp.needsUpdate=true;
      s.pMeta.forEach((p,i)=>{
        const tt=((p.t+time*p.sp)%1);const wob=Math.sin(time*2+p.wob)*p.amp;
        s.pPos[i*3]=dir.x*(inner+(outer-inner)*tt)+Math.cos(time*1.7+p.wob*3)*wob*0.4;
        s.pPos[i*3+1]=dir.y*(inner+(outer-inner)*tt)+wob;
        s.pPos[i*3+2]=dir.z*(inner+(outer-inner)*tt)+Math.sin(time*1.3+p.wob*2)*wob*0.4;
      });
      s.pGeo.attributes.position.needsUpdate=true;
    }
    if(!frozen){sysCoreGlow.scale.setScalar(240+Math.sin(time*1.1)*14);}   // [Blue 令] 環已拆——glow 呼吸保留
  }
  /* L3 大腦緩慢漂移＋呼吸 */
  if(L3.visible){
    L3.rotation.y=Math.sin(time*0.05)*0.3;
    L3.children.forEach((ch,i)=>{if(ch.material&&ch.material.opacity!==undefined&&ch.type==='Sprite')ch.material.opacity=0.08+0.06*Math.sin(time*0.7+i);});
  }
  updateCam();renderer.render(scene,camera);
  frames++;if(t-fT>1000){fpsEl.textContent=(frozen?'❄ ':'')+frames+' fps';frames=0;fT=t;}
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
renderer.setSize(innerWidth,innerHeight);
requestAnimationFrame(loop);
</script>
