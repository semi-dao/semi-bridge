const R_INNER=280,K=2400;
const orbitR=g=>R_INNER+K/Math.sqrt(g);
const orbitW=g=>0.07*Math.sqrt(20000/orbitR(g));

const canvas=document.getElementById('c');

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,60000);

function glowTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const x=cv.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,240,190,.95)');
  gr.addColorStop(.55,'rgba(240,206,94,.45)');gr.addColorStop(1,'rgba(240,206,94,0)');
  x.fillStyle=gr;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(cv);
}
const GLOW=glowTex();
function glowSprite(color,scale,opacity=1){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending,color}));
  s.scale.setScalar(scale);return s;
}

/* ═══ L1 宇宙層 ═══ */
const L1=new THREE.Group();scene.add(L1);
{ const n=2600,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=6000+Math.random()*20000,a=Math.random()*Math.PI*2;
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-0.5)*8000;pos[i*3+2]=Math.sin(a)*r;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  L1.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x2e5f3e,size:5,transparent:true,opacity:.65})));
}
const stars=BITS.map(b=>{
  const grp=new THREE.Group();grp.position.copy(starPos(b));L1.add(grp);
  const core=new THREE.Mesh(new THREE.SphereGeometry(b.blue?16:12,20,20),new THREE.MeshBasicMaterial({color:b.blue?0xfff4cf:0xffe9a3}));
  grp.add(core);
  const glow=glowSprite(b.blue?0xfff0c0:0xf0ce5e,b.blue?150:110);grp.add(glow);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(b.blue?80:56,8,8),new THREE.MeshBasicMaterial({visible:false}));grp.add(hit);
  return{b,grp,core,glow,hit,pos:starPos(b)};
});
L1.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(stars.map(s=>s.pos)),
  new THREE.LineBasicMaterial({color:0xf0ce5e,transparent:true,opacity:.38})));

/* ★ 宏觀的 Blue 貼身迷你衛星（比例修正：緊貼主星自轉） */
const BLUE_STAR=stars.find(st=>st.b.blue);   // [修] 提升至 module 頂層（pick 287 引用）
const miniSats=COMPANIONS.map((c,i)=>{
  const r=58+i*26, w=0.5-i*0.12;
  const grp=new THREE.Group();BLUE_STAR.grp.add(grp);
  const core=new THREE.Mesh(new THREE.SphereGeometry(4,10,10),new THREE.MeshBasicMaterial({color:c.color}));
  grp.add(core);grp.add(glowSprite(c.color,26,.95));
  return{c,r,w,phase:i*2.1,grp};
});

/* ═══ L2 Blue 星系層（掛 BLUE_POS，宏觀時隱藏） ═══ */
const L2=new THREE.Group();L2.position.copy(BLUE_POS);scene.add(L2);
const sysCore=new THREE.Mesh(new THREE.SphereGeometry(26,32,32),new THREE.MeshBasicMaterial({color:0xfff4cf}));
L2.add(sysCore);
const sysCoreGlow=glowSprite(0xfff0c0,240);L2.add(sysCoreGlow);
const sysRing=new THREE.Mesh(new THREE.TorusGeometry(52,1.6,8,90),new THREE.MeshBasicMaterial({color:0xf0ce5e,transparent:true,opacity:.55}));
sysRing.rotation.x=Math.PI/2.35;L2.add(sysRing);
const sysHit=new THREE.Mesh(new THREE.SphereGeometry(90,8,8),new THREE.MeshBasicMaterial({visible:false}));L2.add(sysHit);
const sats=COMPANIONS.map((s,idx)=>{
  const r=orbitR(s.g),w=orbitW(s.g);
  const phase0=idx*(Math.PI*2/3)+(s.seed%1571)/2000;
  const tilt=(((s.seed>>8)%3141)/1000-1.57)*0.45;
  const grp=new THREE.Group();L2.add(grp);
  const core=new THREE.Mesh(new THREE.SphereGeometry(13,20,20),new THREE.MeshBasicMaterial({color:s.color}));
  core.add(glowSprite(s.color,120,.9));grp.add(core);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(44,8,8),new THREE.MeshBasicMaterial({visible:false}));grp.add(hit);
  const pts=[];for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));}
  const orbit=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({color:s.color,transparent:true,opacity:.55,dashSize:10,gapSize:8}));
  orbit.computeLineDistances();orbit.rotation.x=tilt;L2.add(orbit);
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:s.color,transparent:true,opacity:.5}));L2.add(line);
  const NP=Math.min(80,Math.round(s.g/6)+14);
  const pGeo=new THREE.BufferGeometry();const pPos=new Float32Array(NP*3);
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:s.color,size:5.5,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
  L2.add(particles);
  const pMeta=Array.from({length:NP},(_,i)=>({t:i/NP,sp:0.10+((s.seed>>(i%16))%97)/97*0.16,amp:3+((s.seed>>(i%12))%80)/80*7,wob:(s.seed>>(i%10))%628/100}));
  return{...s,r,w,phase0,tilt,grp,core,hit,orbit,line,particles,pGeo,pPos,pMeta};
});

/* ═══ L3 大腦星系層＝iframe 本尊渲染（brain-official.html，進層動態載入） ═══ */
const L3=new THREE.Group();L3.visible=false;scene.add(L3);

/* ════════ 狀態機：L1 宇宙 → L2 星系 → L3 大腦 ════════ */
let state='L1';   // 'L1'|'L2'|'L3'
let target=BLUE_POS.clone(),dist=4200,rotX=0.38,rotY=0.9;
{const q=new URLSearchParams(location.search);if(q.get('dist'))dist=Math.max(60,+q.get('dist'));if(q.get('layer'))state=q.get('layer');}
let follow=null,frozen=false,simTime=0,lastFrame=performance.now();
let flyAnim=null;
function flyTo(dest,endDist){flyAnim={t0:performance.now(),dur:1300,fromT:target.clone(),toT:dest.clone(),fromD:dist,toD:endDist};}
function updateCam(){
  const t=follow?follow.core.getWorldPosition(new THREE.Vector3()):target;
  camera.position.set(t.x+dist*Math.cos(rotX)*Math.sin(rotY),t.y+dist*Math.sin(rotX),t.z+dist*Math.cos(rotX)*Math.cos(rotY));
  camera.lookAt(t);
}
function applyLayerVisibility(){
  const _t=document.getElementById('tip');if(_t)_t.style.display='none';
  L1.visible = state==='L1';
  L2.visible = state==='L2';          // 修：宏觀層絕不渲染 L2 軌道（6 衛星事故根因）
  L3.visible = state==='L3' && !document.getElementById('brainFrame');
  let bf=document.getElementById('brainFrame');
  if(state==='L3'&&!bf){
    bf=document.createElement('iframe');bf.id='brainFrame';
    bf.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2';
    bf.src='brain-official.html?v=20261002e';
    document.body.appendChild(bf);
  } else if(bf){ bf.style.display = state==='L3'?'block':'none'; }
  document.getElementById('privacy').style.display = 'none';
  document.getElementById('back').style.display = state==='L1'?'none':'block';
  const L={L1:['on','',''],L2:['','on',''],L3:['','','on']}[state];
  document.getElementById('layers').innerHTML=
    `<span class="${L[0]}">L1 宏觀宇宙（觀星台）</span><br><span class="${L[1]}">L2 Blue 星系（夥伴）</span><br><span class="${L[2]}">L3 大腦星系（記憶）</span>`;
  document.getElementById('lod').textContent={L1:'✨ 宏觀宇宙層',L2:'🔭 Blue 星系層',L3:'🧠 大腦星系層'}[state];
}
applyLayerVisibility();
if(state==='L2'){dist=900;} if(state==='L3'){dist=4200;}

/* ══════ 互動 ══════ */
/* 手機雙擊偵測（iOS Safari 不發 dblclick）＋返回按鈕 */
let lastTap=0, lastTapX=0, lastTapY=0;
function tapHandler(cx,cy){
  const _t=document.getElementById('tip');if(_t)_t.style.display='none';
  const now=performance.now();
  if(now-lastTap<320 && Math.abs(cx-lastTapX)<40 && Math.abs(cy-lastTapY)<40){
    lastTap=0; enterLayer(cx,cy);   // 雙擊 tap
  } else { lastTap=now; lastTapX=cx; lastTapY=cy; }
}
function enterLayer(cx,cy){
  const hit=pick(cx,cy);
  if(state==='L1'){
    if(hit&&hit.blueStar){state='L2';follow=null;flyTo(BLUE_POS,950);frozen=true;applyLayerVisibility();}
    else if(hit&&hit.star){follow=null;flyTo(hit.star.pos,170);}
    else{follow=null;flyTo(new THREE.Vector3(0,0,0),4200);}
  }else if(state==='L2'){
    if(hit&&hit.sat){follow=hit.sat;flyTo(BLUE_POS,420);return;}
    const m=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
    ray.setFromCamera(m,camera);
    if(ray.intersectObject(sysHit,false).length||!hit){state='L3';follow=null;dist=4200;applyLayerVisibility();}
  }else if(state==='L3'){
    state='L2';flyTo(BLUE_POS,950);applyLayerVisibility();
  }
}
document.getElementById('back').addEventListener('click',()=>{
  if(state==='L3'){state='L2';flyTo(BLUE_POS,950);}
  else if(state==='L2'){state='L1';flyTo(BLUE_POS,4200);}
  follow=null;applyLayerVisibility();
});
canvas.addEventListener('dblclick',e=>enterLayer(e.clientX,e.clientY));

let dragging=false,px=0,py=0,moved=0,vy=0,vx=0;
const ptrs=new Map();let pinch0=0,distP0=0;
canvas.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragging=true;moved=0;px=e.clientX;py=e.clientY;vy=vx=0;canvas.classList.add('dragging');}
  else if(ptrs.size===2){dragging=false;const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);distP0=dist;}
  canvas.setPointerCapture(e.pointerId);
});
addEventListener('pointerup',e=>{
  ptrs.delete(e.pointerId);
  if(!ptrs.size){
    dragging=false;canvas.classList.remove('dragging');
    if(moved<8 && e.pointerType!=='mouse') tapHandler(e.clientX,e.clientY);   // mobile tap：雙擊偵測
  }
});
addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size){dragging=false;canvas.classList.remove('dragging');}});
canvas.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const p=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0>0)dist=Math.max(60,Math.min(30000,distP0*pinch0/p));moved+=9;return;}
  if(!dragging)return;const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);
  if(Math.abs(dx)>Math.abs(dy))frozen=false;
  rotY+=dx*0.005;rotX=Math.max(-1.4,Math.min(1.4,rotX+dy*0.004));vx=dx*0.004;vy=dy*0.003;px=e.clientX;py=e.clientY;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(60,Math.min(30000,dist*(1+Math.sign(e.deltaY)*0.09)));},{passive:false});

const ray=new THREE.Raycaster();
function pick(cx,cy){
  const m=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
  ray.setFromCamera(m,camera);
  /* [修] 距離排序撿取：取 raycast 最近命中——重疊時不再拿錯星 */
  if(state==='L2'){
    const cands=[...sats.map(s=>({m:s.hit,r:{sat:s}})),{m:sysHit,r:{sysCore:true}}];
    const hs=ray.intersectObjects(cands.map(o=>o.m),false);
    if(hs.length)return cands.find(o=>o.m===hs[0].object).r;
    return null;
  }
  if(state==='L1'){
    const cands=[{m:BLUE_STAR.hit,r:{blueStar:true}},...stars.map(st=>({m:st.hit,r:{star:st}}))];
    const hs=ray.intersectObjects(cands.map(o=>o.m),false);
    if(hs.length)return cands.find(o=>o.m===hs[0].object).r;
    return null;
  }
  return null;
}
canvas.addEventListener('dblclick',e=>{
  const hit=pick(e.clientX,e.clientY);
  if(state==='L1'){
    if(hit&&hit.blueStar){state='L2';follow=null;flyTo(BLUE_POS,950);frozen=true;applyLayerVisibility();}
    else if(hit&&hit.star){follow=null;flyTo(hit.star.pos,170);}
    else{follow=null;flyTo(new THREE.Vector3(0,0,0),4200);}
  }else if(state==='L2'){
    if(hit&&(hit.sysCore||hit.sat)){ /* 雙擊主星或衛星核心皆進大腦 */ }
    // 主星雙擊 → 大腦
    const m=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(m,camera);
    if(ray.intersectObject(sysHit,false).length){state='L3';follow=null;dist=4200;applyLayerVisibility();}
    else if(hit&&hit.sat){follow=hit.sat;flyTo(BLUE_POS,420);}
  }else if(state==='L3'){
    state='L2';flyTo(BLUE_POS,950);applyLayerVisibility();
  }
});
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){state='L1';follow=null;flyTo(BLUE_POS,4200);rotX=0.38;rotY=0.9;applyLayerVisibility();}});

const tip=document.getElementById('tip'),card=document.getElementById('card');
canvas.addEventListener('click',e=>{
  if(moved>6)return;
  const hit=pick(e.clientX,e.clientY);
  if(!hit){card.style.display='none';return;}
  frozen=true;
  if(hit.sat){
    const s=hit.sat;
    card.innerHTML=`<h4>🛰️ ${s.name}</h4><div class="sub">${s.mbti} · ${s.role} · 互動 ${s.g} bits · 夥伴卡（真實資料）</div>
      <div class="row"><b>種族</b>：${s.species}</div>
      <div class="row"><b>個性</b>：${s.personality}</div>
      <div class="row"><b>專長</b>：${s.expertise}</div>
      <div class="row"><b>特殊功能</b>：${s.specialFunction}</div>
      <div class="row"><b>關係</b>：${s.relationship}</div>
      <div class="row"><b>起源</b>：${s.born}</div>
      <div style="color:#7fa88f;font-size:11px;margin-top:8px">軌道半徑 ${Math.round(s.r)}（引力=${s.g} bits 統計陰影）· 週期 ${(2*Math.PI/s.w).toFixed(0)}s<br>❄ 已凍結——橫向拖曳恢復 · 雙擊主星進大腦星系</div>`;
  }else if(hit.star){
    const st=hit.star;
    card.innerHTML=`<h4>⭐ ${st.b.id}</h4><div class="sub">S.D. Day ${st.b.sd} · n=${st.b.n}</div><div>${st.b.label}${st.b.blue?'<br><b style="color:#ffe9a3">★ 雙擊＝飛入 Blue 星系</b>':''}</div><div style="color:#7fa88f;font-size:11px;margin-top:8px">hash ${st.b.hash}… · r=${Math.round(R0*Math.sqrt(st.b.n))}<br>❄ 已凍結——橫向拖曳恢復</div>`;
  }else if(hit.sysCore){
    card.innerHTML=`<h4>⭐ Blue 的 Bit 星（質心）</h4><div class="sub">人類用戶 Bit · ${COMPANIONS.length} 顆衛星</div><div>三顆衛星＝夥伴卡成員，軌道由互動引力導出。<b style="color:#ffe9a3">雙擊這顆星＝進入大腦星系圖譜</b>。</div>`;
  }else if(hit.memory){
    const nd=hit.memory;
    const dt=nd.t?new Date(nd.t).toLocaleString('zh-TW'):'—';
    card.innerHTML=`<h4>🧠 記憶星</h4><div class="sub">${nd.room||''} · ${nd.sub||''} · 重要性 ${nd.imp}/5 · 引用 ${nd.links||0} 檔案</div>
      <div style="color:#dfeee0">${nd.preview}…</div>
      <div style="color:#7fa88f;font-size:11px;margin-top:8px">❄ 已凍結——橫向拖曳恢復</div>`;
  }
  card.style.display='block';
});
const IS_TOUCH=('ontouchstart' in window);
canvas.addEventListener('mousemove',e=>{
  if(IS_TOUCH)return;
  const hit=pick(e.clientX,e.clientY);
  if(hit){tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+10)+'px';
    tip.textContent=hit.sat?`${hit.sat.name} · ${hit.sat.mbti}`:hit.star?hit.star.b.label:hit.sysCore?'Blue 質心（雙擊進大腦）':hit.memory?(hit.memory.preview.slice(0,18)+'…'):'';}
  else tip.style.display='none';
});

/* ════════ 主循環 ════════ */
const fpsEl=document.getElementById('fps');let frames=0,fT=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastFrame)/1000);lastFrame=t;
  if(!frozen)simTime+=dt;
  const time=simTime;
  if(flyAnim){
    const k=Math.min(1,(t-flyAnim.t0)/flyAnim.dur),e=1-Math.pow(1-k,3);
    target.lerpVectors(flyAnim.fromT,flyAnim.toT,e);
    dist=flyAnim.fromD+(flyAnim.toD-flyAnim.fromD)*e;
    if(k>=1)flyAnim=null;
  }
  if(!dragging){rotY+=vx;rotX=Math.max(-1.4,Math.min(1.4,rotX+vy));vx*=0.95;vy*=0.95;}
  if(!frozen)rotY+=0.0004*60*dt;

  /* L1：迷你衛星貼身自轉 */
  miniSats.forEach(ms=>{const a=ms.phase+time*ms.w;ms.grp.position.set(Math.cos(a)*ms.r,Math.sin(a*0.7)*ms.r*0.25,Math.sin(a)*ms.r);});

  /* L2 軌道 */
  if(L2.visible){
    for(const s of sats){
      const a=s.phase0+time*s.w;
      const x=Math.cos(a)*s.r,z=Math.sin(a)*s.r*Math.cos(s.tilt),y=-Math.sin(a)*s.r*Math.sin(s.tilt);
      s.grp.position.set(x,y,z);
      const D=Math.hypot(x,y,z),dir=new THREE.Vector3(x/D,y/D,z/D);
      const inner=210,outer=Math.max(inner+40,D-32);
      const lp=s.line.geometry.attributes.position;
      lp.setXYZ(0,dir.x*inner,dir.y*inner,dir.z*inner);lp.setXYZ(1,dir.x*outer,dir.y*outer,dir.z*outer);lp.needsUpdate=true;
      s.pMeta.forEach((p,i)=>{
        const tt=((p.t+time*p.sp)%1);const wob=Math.sin(time*2+p.wob)*p.amp;
        s.pPos[i*3]=dir.x*(inner+(outer-inner)*tt)+Math.cos(time*1.7+p.wob*3)*wob*0.4;
        s.pPos[i*3+1]=dir.y*(inner+(outer-inner)*tt)+wob;
        s.pPos[i*3+2]=dir.z*(inner+(outer-inner)*tt)+Math.sin(time*1.3+p.wob*2)*wob*0.4;
      });
      s.pGeo.attributes.position.needsUpdate=true;
    }
    if(!frozen){sysRing.rotation.z=time*0.08;sysCoreGlow.scale.setScalar(240+Math.sin(time*1.1)*14);}
  }
  /* L3 大腦緩慢漂移＋呼吸 */
  if(L3.visible){
    L3.rotation.y=Math.sin(time*0.05)*0.3;
    L3.children.forEach((ch,i)=>{if(ch.material&&ch.material.opacity!==undefined&&ch.type==='Sprite')ch.material.opacity=0.08+0.06*Math.sin(time*0.7+i);});
  }
  updateCam();renderer.render(scene,camera);
  frames++;if(t-fT>1000){fpsEl.textContent=(frozen?'❄ ':'')+frames+' fps';frames=0;fT=t;}
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
renderer.setSize(innerWidth,innerHeight);
requestAnimationFrame(loop);
</script>
