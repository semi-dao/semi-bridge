/* ════════ ★ 絕對位置定理（宇宙誕生即定死的物理法） ════════
   r(n) = R0·√n     ——平方根膨脹律（真實宇宙的均勻圓盤性質）
   θ, y = hash      ——內容定址：hash 即座標，永遠不變
   n = bit 的鏈上序號——任何人重放 ledger 都得到同一張星圖（確定性）
   新星推動邊界、舊星永不移動——已塌縮的歷史不可移動
   bit-000001（開源＋首次 A2A）= 宇宙原點 */
const R0 = 420;   // 基準半徑（n=1 時原點、n=2 在 R0、之後 √n 膨脹）

function starPos(b){
  if(b.n === 1) return new THREE.Vector3(0,0,0);   // 創世星=原點
  const r = R0 * Math.sqrt(b.n);
  const ang = parseInt(b.hash.slice(0,4),16)/0xffff*Math.PI*2;
  const y = ((parseInt(b.hash.slice(4,6),16)/255)-0.5)*r*0.55;   // 高度隨半徑等比展開（盤面扁平如星系）
  return new THREE.Vector3(Math.cos(ang)*r, y, Math.sin(ang)*r);
}

/* ════════ 場景 ════════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030b06, 0.00022);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 40000);
const galaxy = new THREE.Group(); scene.add(galaxy);

/* ════════ 相機 rig（App 手感） ════════ */
let target = new THREE.Vector3(0,0,0);
let dist = 2200, rotX = 0.35, rotY = 0.6;
{ const q = new URLSearchParams(location.search);   // 測試/分享用視角參數
  if(q.get('dist')) dist = Math.max(10, +q.get('dist')); }
const COSMOS_R = 32000;   // √n 宇宙的邊界（n=1e4 時 r≈42000）
const clampTarget = ()=>{ if(target.length()>COSMOS_R) target.setLength(COSMOS_R); };
function updateCam(){
  camera.position.set(
    target.x+dist*Math.cos(rotX)*Math.sin(rotY),
    target.y+dist*Math.sin(rotX),
    target.z+dist*Math.cos(rotX)*Math.cos(rotY));
  camera.lookAt(target);
}
updateCam();

/* ════════ bits 星座（核心加大＋光暈級撿取） ════════ */
const CORE_R = 16;                    // 核心半徑（原 9 → 16：好瞄）
const HALO_R = 62;                    // 光暈半徑（hover/點擊命中區）
const starGeo = new THREE.SphereGeometry(CORE_R, 24, 24);
const haloGeo = new THREE.SphereGeometry(HALO_R, 16, 16);
const bitMeshes = [], haloPickers = [];
function glowTex(){
  const cv = document.createElement('canvas'); cv.width=cv.height=64;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(32,32,2,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,220,130,.5)'); gr.addColorStop(1,'rgba(255,220,130,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const GLOW = glowTex();
const haloSprites = [];
LEDGER.bits.forEach(b => {
  const pos = starPos(b);
  // 核心
  const m = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({color:0xffe9a3}));
  m.position.copy(pos); m.userData = b;
  galaxy.add(m); bitMeshes.push(m);
  // 視覺光暈（sprite 柔光）
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW, color:0xffd76e, transparent:true, opacity:.6, blending:THREE.AdditiveBlending, depthWrite:false}));
  halo.scale.setScalar(HALO_R*4.4); halo.position.copy(pos);
  galaxy.add(halo); haloSprites.push(halo);
  // ★ 撿取代理（隱形大球——移到光暈就命中）
  const picker = new THREE.Mesh(haloGeo, new THREE.MeshBasicMaterial({visible:false}));
  picker.position.copy(pos); picker.userData = b;
  galaxy.add(picker); haloPickers.push(picker);
});
/* hash 鏈金線 */
const chainPts = new THREE.CatmullRomCurve3(bitMeshes.map(m=>m.position), false, 'catmullrom', .3).getPoints(240);
galaxy.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(chainPts),
  new THREE.LineBasicMaterial({color:0xffd76e, transparent:true, opacity:.7})));

/* ════════ 背景星塵（√n 宇宙的外圍——隨邊界展開） ════════ */
{
  const edge = R0*Math.sqrt(LEDGER.bits.length+2);   // 星塵鋪到略超過當前邊界
  const N = 2600, pos = new Float32Array(N*3), col = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r = edge*0.3 + Math.random()*edge*1.6, a = Math.random()*Math.PI*2;
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=(Math.random()-.5)*r*0.5; pos[i*3+2]=Math.sin(a)*r;
    const dim = .5+Math.random()*.5;
    col[i*3]=dim*.7; col[i*3+1]=dim; col[i*3+2]=dim*.75;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  galaxy.add(new THREE.Points(g, new THREE.PointsMaterial({size:4.5, vertexColors:true, transparent:true, opacity:.95, depthWrite:false})));
}

/* ════════ 標籤藥丸 ════════ */
function pillTex(text){
  const cv = document.createElement('canvas'); cv.width=512; cv.height=88;
  const g = cv.getContext('2d');
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();};
  g.fillStyle='rgba(6,20,12,.78)'; rr(6,14,500,60,28); g.fill();
  g.strokeStyle='rgba(255,233,163,.4)'; g.lineWidth=2; rr(6,14,500,60,28); g.stroke();
  g.fillStyle='#d8f3d0'; g.font='26px "SF Mono",Menlo,monospace';
  g.fillText(text, 22, 54);
  const t = new THREE.CanvasTexture(cv); t.anisotropy=4; return t;
}
function short(t){ return t.length>20 ? t.slice(0,18)+'…' : t; }
const labelSprites = [];
bitMeshes.forEach(m=>{
  const b = m.userData;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:pillTex(`${b.id.replace('bit-','SD')} · ${short(b.what)}`), transparent:true, depthWrite:false}));
  sp.scale.set(700, 121, 1); sp.position.copy(m.position).add(new THREE.Vector3(0, 115, 0));
  galaxy.add(sp); labelSprites.push(sp);
});

/* ════════ 互動（App 手感 + 光暈級撿取 + 詳情按鈕） ════════ */
let mode=null;
let spaceHeld=false;
const spin={on:true, vy:0.05, vx:0};
let flyTo=null;
let px=0,py=0;
const samples=[];
let spinWasOn=true;
let downX0=0, downY0=0;

canvas.addEventListener('mousedown',e=>{ if(e.button===1) e.preventDefault(); });
canvas.addEventListener('auxclick',e=>{ if(e.button===1) e.preventDefault(); });
let midDown=false;
canvas.addEventListener('mousedown',e=>{ if(e.button===1) midDown=true; });
addEventListener('mouseup',e=>{ if(e.button===1) midDown=false; });
addEventListener('blur',()=>{ mode=null; midDown=false; spin.on=spinWasOn; });

addEventListener('keydown',e=>{
  if(e.key===' '){ spaceHeld=true; }
  if(e.key==='r'||e.key==='R'){ target.set(0,0,0); dist=2200; rotX=0.35; rotY=0.6; flyTo=null; spin.on=true; spin.vy=0.05; spin.vx=0; }
});
addEventListener('keyup',e=>{ if(e.key===' ') spaceHeld=false; });

canvas.addEventListener('pointerdown',e=>{
  mode = (e.button===1||spaceHeld) ? 'pan' : 'rotate';
  if(mode==='pan' && !(e.buttons&4) && !spaceHeld){ mode='rotate'; }
  px=e.clientX; py=e.clientY;
  downX0=e.clientX; downY0=e.clientY;
  samples.length=0;
  spinWasOn=spin.on;
  spin.on=false;
  canvas.classList.add('dragging');
});
addEventListener('pointerup',e=>{
  canvas.classList.remove('dragging');
  if(mode==='rotate'){
    const now=performance.now();
    const recent=samples.filter(s=>now-s.t<120);
    if(recent.length>=2){
      const dt=Math.max(16, now-recent[0].t);
      spin.vy=-(e.clientX-recent[0].x)/dt*0.005;
      spin.vx=(e.clientY-recent[0].y)/dt*0.004;
      if(Math.abs(spin.vy)<0.05) spin.vy=spin.vy<0?-0.05:0.05;
    } else { spin.vy=0.05; spin.vx=0; }
    spin.on = Math.hypot((e.clientX||0)-downX0,(e.clientY||0)-downY0)>4;
    if(!spin.on) pick(e.clientX, e.clientY);
  }
  mode=null;
});
addEventListener('pointermove',e=>{
  if(!mode){ hover(e.clientX,e.clientY); return; }
  const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  if(mode==='rotate'){
    rotY-=dx*0.005; rotX+=dy*0.004;
    samples.push({x:e.clientX,y:e.clientY,t:performance.now()});
    if(samples.length>10) samples.shift();
  } else {
    const k=2*dist*Math.tan(camera.fov*Math.PI/360)/innerHeight;
    const fwd=new THREE.Vector3().subVectors(target,camera.position).normalize();
    const right=new THREE.Vector3().crossVectors(fwd,camera.up).normalize();
    const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
    target.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);
    clampTarget();
  }
});
canvas.addEventListener('wheel',e=>{
  const rect=canvas.getBoundingClientRect();
  const nx=((e.clientX-rect.left)/rect.width)*2-1, ny=-((e.clientY-rect.top)/rect.height)*2+1;
  const rc=new THREE.Raycaster(); rc.setFromCamera({x:nx,y:ny},camera);
  let speed = dist*0.13;
  try{
    const hits=rc.intersectObjects(haloPickers,false).sort((a,b)=>a.distance-b.distance);
    if(hits.length){
      const D=hits[0].distance;
      speed = Math.min(D*0.35, Math.max(dist*0.02, D*0.13));
    }
  }catch(_){}
  target.addScaledVector(rc.ray.direction, e.deltaY<0 ? speed : -speed*1.15);
  if(e.deltaY<0) dist=Math.max(10,dist*0.94); else dist=Math.min(28000,dist*1.06);
  clampTarget();
},{passive:true});

canvas.addEventListener('dblclick',e=>{
  const hit = rayHit(e.clientX, e.clientY);
  if(hit){
    spin.on=false;
    const wp = hit.object.position.clone();
    galaxy.localToWorld(wp);
    startFly(wp);
    showCard(hit.object.userData);
  }
});
function rayHit(cx, cy){
  const rect=canvas.getBoundingClientRect();
  ptr.x=((cx-rect.left)/rect.width)*2-1; ptr.y=-((cy-rect.top)/rect.height)*2+1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(haloPickers, false);
  return hits[0] || null;
}
function startFly(to){ flyTo={to:to.clone(), dist0:dist, t0:performance.now()}; }
function stepFly(){
  if(!flyTo) return;
  const el=(performance.now()-flyTo.t0)/1200;
  if(el>=1){ target.copy(flyTo.to); clampTarget(); dist=170; flyTo=null; return; }
  const e=1-Math.pow(1-el,3);
  target.lerp(flyTo.to, e*0.12+0.001);
  dist=flyTo.dist0+(170-flyTo.dist0)*e;
}

/* ════════ 撿星 / hover / 詳情卡 ════════ */
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
const card = document.getElementById('card');
const tip = document.getElementById('tip');
function pick(cx, cy){
  const hit = rayHit(cx, cy);
  if(hit) showCard(hit.object.userData);
  else card.style.display='none';
}
function showCard(b, expanded){
  const evList = (b.evidence||[]).map(e=>`<div>· ${e}</div>`).join('');
  card.innerHTML = `
    <h4>⭐ ${b.id}</h4>
    <div class="sub">S.D. Day ${b.sd_day} · ${b.collapsed_at.slice(0,16)} · 相位 ${b.phase}</div>
    <div class="body">${expanded ? b.what : short(b.what)}</div>
    <button class="detail">${expanded ? '收合 ▲' : '看詳情 ▼'}</button>
    ${expanded ? `<div class="ev"><b>證據鏈：</b>${evList}</div>
    <div class="ev">hash: ${b.hash}…（hash 即座標——這顆星永遠在這裡）</div>` : ''}`;
  card.style.display='block';
  card.querySelector('button.detail').onclick = ()=> showCard(b, !expanded);
}
function hover(cx, cy){
  const hit = rayHit(cx, cy);
  if(hit){
    tip.textContent = hit.object.userData.id + ' · ' + short(hit.object.userData.what);
    tip.style.left = (cx+14)+'px'; tip.style.top = (cy-10)+'px'; tip.style.display='block';
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor=''; }
}

/* ════════ LOD 分層（憲章 §8.2——宇宙無限，渲染有限，感知無損） ════════
   近（<2600）：全渲染（標籤+光暈+核心）
   中（<6000）：光球縮小、標籤淡出
   遠（≥6000）：光點+微光暈，標籤隱藏 */
const _lodV3 = new THREE.Vector3();
function updateLOD(){
  const diag=[];
  for(let i=0;i<bitMeshes.length;i++){
    _lodV3.copy(bitMeshes[i].position); galaxy.localToWorld(_lodV3);
    const d = camera.position.distanceTo(_lodV3);
    diag.push(Math.round(d));
    const lab = labelSprites[i], hal = haloSprites[i];
    if(d < 2600){                       // 近：全渲染
      lab.visible = true;  lab.material.opacity = 1;
      hal.scale.setScalar(HALO_R*4.4);
      bitMeshes[i].scale.setScalar(1);
    } else if(d < 6000){                // 中：降精度
      const f = 1 - (d-2600)/3400;      // 1→0 漸變
      lab.visible = f > 0.15; lab.material.opacity = Math.max(0, f);
      hal.scale.setScalar(HALO_R*4.4*(0.4+0.6*f));
      bitMeshes[i].scale.setScalar(0.5+0.5*f);
    } else {                            // 遠：光點
      lab.visible = false;
      hal.scale.setScalar(HALO_R*2.2);
      bitMeshes[i].scale.setScalar(0.35);
    }
  }
  if(!updateLOD._lastDiag || performance.now()-updateLOD._lastDiag>2000){
    updateLOD._lastDiag=performance.now();
    document.getElementById('fps').setAttribute('data-diag', JSON.stringify({dist:Math.round(dist), starD:diag, lab:labelSprites.map(l=>l.visible?1:0)}));
  }
}

/* ════════ 主迴圈 ════════ */
const ftimes=[]; const fpsEl=document.getElementById('fps');
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let _last=performance.now();
renderer.setAnimationLoop(()=>{
  const now=performance.now();
  const dt=Math.min(0.05,(now-_last)/1000); _last=now;
  if(mode===null && spin.on){ rotY+=spin.vy*dt; rotX+=spin.vx*dt; }
  stepFly();
  updateCam();
  updateLOD();
  renderer.render(scene, camera);
  ftimes.push(now);
  if(ftimes.length>90){
    const span=ftimes[ftimes.length-1]-ftimes[0];
    fpsEl.textContent = Math.round(1000/(span/89)) + ' FPS';
    ftimes.shift();
  }
});
</script>
