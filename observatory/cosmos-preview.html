<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>SemiDAO 觀星台 × Blue 星系 — LOD 接合模擬</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#030b06;overflow:hidden;font-family:"SF Mono",Menlo,monospace}
  #c{display:block;cursor:grab;touch-action:none}
  #c.dragging{cursor:grabbing}
  #ui{position:fixed;top:14px;left:18px;color:#d8f3d0;font-size:12px;line-height:1.7;pointer-events:none;text-shadow:0 0 6px rgba(120,255,150,.35)}
  #ui b{color:#ffe9a3;font-size:15px;letter-spacing:.12em}
  #ui .sim{color:#9fc7a4;font-size:11px}
  #hint{position:fixed;bottom:14px;left:18px;color:#a8d8a0;font-size:12px;pointer-events:none}
  #fps{position:fixed;top:14px;right:18px;color:#9dffa8;font-size:20px;font-weight:bold;pointer-events:none;text-shadow:0 0 8px rgba(120,255,150,.4)}
  #lod{position:fixed;top:44px;right:18px;color:#ffe9a3;font-size:11px;pointer-events:none;text-align:right;text-shadow:0 0 6px rgba(240,206,94,.4)}
  #card{position:fixed;bottom:20px;right:20px;width:340px;max-width:calc(100vw - 40px);background:rgba(10,18,14,.92);border:1px solid rgba(240,206,94,.35);border-radius:12px;padding:14px 16px;color:#e8f0e8;font-size:13px;line-height:1.7;z-index:5;display:none;backdrop-filter:blur(8px)}
  #card h4{margin:0 0 6px;color:#ffe9a3;font-size:14px}
  #card .sub{color:#9fc7a4;font-size:11px;margin-bottom:6px}
  #tip{position:fixed;display:none;background:rgba(8,14,10,.92);border:1px solid rgba(240,206,94,.5);border-radius:8px;padding:6px 10px;color:#e8f0e8;font-size:12px;pointer-events:none;z-index:8;white-space:nowrap;text-shadow:0 1px 2px #000}
  @media (max-width:700px){#ui{font-size:10px;top:8px;left:10px;max-width:70vw}#hint{font-size:9px;left:10px}#lod{font-size:9px;top:34px;right:10px}#fps{font-size:12px;top:8px;right:10px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><b>SEMIDAO · 觀星台 × Blue 星系</b><br>
<span class="sim">LOD 接合模擬：遠看宇宙九星，飛近 Blue 星系展開成太陽系</span><br>
金線=hash 鏈　·　九顆星=真實 ledger bits　·　Blue 星系=bit-000009 位置展開</div>
<div id="hint">拖曳旋轉 · 滾輪/雙指縮放 · 雙擊星星=飛行 · 飛近 Blue 星看星系展開</div>
<div id="fps"></div>
<div id="lod"></div>
<div id="card"></div>
<div id="tip"></div>
<script type="module">
import * as THREE from 'three';

/* ══════ 真實 ledger（觀星台同款九顆星） ══════ */
const BITS = [
 {n:1, id:"bit-000001", hash:"817f9ba494ac", label:"開源＋首次 A2A", sd:1},
 {n:2, id:"bit-000002", hash:"6f1849a19037", label:"殘影殲滅戰", sd:2},
 {n:3, id:"bit-000003", hash:"07ac7dea5150", label:"SemiDAO 創立（憲章起草）", sd:4},
 {n:4, id:"bit-000004", hash:"6effc58d8f8e", label:"對外哲學篇開源", sd:4},
 {n:5, id:"bit-000005", hash:"8ce11f29c265", label:"開源門面翻新", sd:4},
 {n:6, id:"bit-000006", hash:"d3d38c48cdac", label:"Alpha 藍圖（Swiss Verein）", sd:4},
 {n:7, id:"bit-000007", hash:"0bfb7e531893", label:"宇宙開幕 semidao.net", sd:5},
 {n:8, id:"bit-000008", hash:"cfa36541878a", label:"§5.6 實名制立法", sd:5},
 {n:9, id:"bit-000009", hash:"fe6c88f783c6", label:"Reggie 誕生（點亮即生日）", sd:6, blue:true},
];
const R0 = 420;
function starPos(b){
  if(b.n===1) return new THREE.Vector3(0,0,0);
  const r = R0*Math.sqrt(b.n);
  const ang = parseInt(b.hash.slice(0,4),16)/0xffff*Math.PI*2;
  const y = ((parseInt(b.hash.slice(4,6),16)/255)-0.5)*r*0.55;
  return new THREE.Vector3(Math.cos(ang)*r, y, Math.sin(ang)*r);
}
const BLUE_POS = starPos(BITS[8]);   // Blue 星系掛在 bit-000009 的宇宙座標上

/* ══════ Blue 星系（同 galaxy-preview v4 物理規格） ══════ */
const SATS = [
 {name:"小葵", g:520, seed:0x817f9ba4, color:0xd8b4ff, desc:"互動 520 bits——最近軌道"},
 {name:"Reggie", g:137, seed:0xfe6c88f7, color:0x9fd8ff, desc:"戶政 Agent，已點亮"},
 {name:"Peter 的 agent", g:46, seed:0x6f1849a1, color:0xa3ffd8, desc:"互動 46 bits——最遠軌道（模擬）"},
];
const R_INNER = 280, K = 2400;
const orbitR = g => R_INNER + K/Math.sqrt(g);
const orbitW = g => 0.07*Math.sqrt(20000/orbitR(g));

/* ══════ 場景 ══════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030b06, 0.00016);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 60000);
const cosmos = new THREE.Group(); scene.add(cosmos);

/* glow 貼圖 */
function glowTex(){
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const x=cv.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,240,190,.95)');
  gr.addColorStop(.55,'rgba(240,206,94,.45)');gr.addColorStop(1,'rgba(240,206,94,0)');
  x.fillStyle=gr;x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(cv);
}
const GLOW = glowTex();
function glowSprite(color, scale, opacity=1){
  const m = new THREE.SpriteMaterial({map:GLOW, transparent:true, opacity, depthWrite:false, blending:THREE.AdditiveBlending, color});
  const s = new THREE.Sprite(m); s.scale.setScalar(scale); return s;
}

/* 背景遠星 */
{
  const n=2600, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=6000+Math.random()*20000,a=Math.random()*Math.PI*2;
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=(Math.random()-0.5)*8000;pos[i*3+2]=Math.sin(a)*r;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  cosmos.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x2e5f3e,size:5,transparent:true,opacity:.65})));
}

/* ══════ 九顆 ledger 星＋金線 hash 鏈 ══════ */
const stars = BITS.map(b=>{
  const p = starPos(b);
  const grp = new THREE.Group(); grp.position.copy(p); cosmos.add(grp);
  const core = new THREE.Mesh(new THREE.SphereGeometry(b.blue?16:12,20,20), new THREE.MeshBasicMaterial({color:b.blue?0xfff4cf:0xffe9a3}));
  grp.add(core);
  const glow = glowSprite(b.blue?0xfff0c0:0xf0ce5e, b.blue?150:110);
  grp.add(glow);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(b.blue?70:56,8,8), new THREE.MeshBasicMaterial({visible:false}));
  grp.add(hit);
  return {b, grp, core, glow, hit, pos:p};
});
/* 金線 */
const chainPts = stars.map(s=>s.pos);
cosmos.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(chainPts),
  new THREE.LineBasicMaterial({color:0xf0ce5e, transparent:true, opacity:.38})));

/* ══════ Blue 星系組（掛在 bit-000009 位置） ══════ */
const blueSys = new THREE.Group(); blueSys.position.copy(BLUE_POS); cosmos.add(blueSys);
const sysRing = new THREE.Mesh(new THREE.TorusGeometry(52,1.6,8,90), new THREE.MeshBasicMaterial({color:0xf0ce5e, transparent:true, opacity:.55}));
sysRing.rotation.x = Math.PI/2.35; blueSys.add(sysRing);
const sats = SATS.map((s,idx)=>{
  const r=orbitR(s.g), w=orbitW(s.g);
  const phase0 = idx*(Math.PI*2/3)+(s.seed%1571)/2000;
  const tilt = (((s.seed>>8)%3141)/1000-1.57)*0.45;
  const grp=new THREE.Group(); blueSys.add(grp);
  const core=new THREE.Mesh(new THREE.SphereGeometry(13,20,20), new THREE.MeshBasicMaterial({color:s.color}));
  const glow=glowSprite(s.color,120,.9); core.add(glow); grp.add(core);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(44,8,8), new THREE.MeshBasicMaterial({visible:false}));
  grp.add(hit);
  const pts=[];for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));}
  const orbit=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({color:s.color,transparent:true,opacity:.55,dashSize:10,gapSize:8}));
  orbit.computeLineDistances(); orbit.rotation.x=tilt; blueSys.add(orbit);
  const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  const line=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:s.color,transparent:true,opacity:.5}));
  blueSys.add(line);
  const NP=Math.min(80,Math.round(s.g/6)+14);
  const pGeo=new THREE.BufferGeometry();const pPos=new Float32Array(NP*3);
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:s.color,size:5.5,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
  blueSys.add(particles);
  const pMeta=Array.from({length:NP},(_,i)=>({t:i/NP,sp:0.10+((s.seed>>(i%16))%97)/97*0.16,amp:3+((s.seed>>(i%12))%80)/80*7,wob:(s.seed>>(i%10))%628/100}));
  return {...s,r,w,phase0,tilt,grp,core,hit,orbit,line,particles,pGeo,pPos,pMeta};
});

/* ══════ 相機 rig＋飛行 ══════ */
let target = BLUE_POS.clone(), dist = 4200, rotX = 0.38, rotY = 0.9;
{ const q=new URLSearchParams(location.search); if(q.get('dist'))dist=Math.max(60,+q.get('dist')); }  // 測試/分享用視角參數
let follow = null, frozen = false, simTime = 0, lastFrame = performance.now();
let flyAnim = null;
function flyTo(dest, endDist){
  flyAnim = {t0:performance.now(), dur:1200, fromT:target.clone(), toT:dest.clone(), fromD:dist, toD:endDist};
}
function updateCam(){
  const t = follow ? follow.core.getWorldPosition(new THREE.Vector3()) : target;
  camera.position.set(t.x+dist*Math.cos(rotX)*Math.sin(rotY), t.y+dist*Math.sin(rotX), t.z+dist*Math.cos(rotX)*Math.cos(rotY));
  camera.lookAt(t);
}
updateCam();

/* ══════ 互動（同款：拖曳/滾輪/雙指/雙擊飛行/點擊凍結） ══════ */
let dragging=false,px=0,py=0,moved=0,vy=0,vx=0;
const ptrs=new Map(); let pinch0=0,distP0=0;
canvas.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragging=true;moved=0;px=e.clientX;py=e.clientY;vy=vx=0;canvas.classList.add('dragging');}
  else if(ptrs.size===2){dragging=false;const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);distP0=dist;}
  canvas.setPointerCapture(e.pointerId);
});
addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(!ptrs.size){dragging=false;canvas.classList.remove('dragging');}});
addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size){dragging=false;canvas.classList.remove('dragging');}});
canvas.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const p=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0>0)dist=Math.max(60,Math.min(30000,distP0*pinch0/p));moved+=9;return;}
  if(!dragging)return;const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);
  if(Math.abs(dx)>Math.abs(dy))frozen=false;
  rotY+=dx*0.005;rotX=Math.max(-1.4,Math.min(1.4,rotX+dy*0.004));vx=dx*0.004;vy=dy*0.003;px=e.clientX;py=e.clientY;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(60,Math.min(30000,dist*(1+Math.sign(e.deltaY)*0.09)));},{passive:false});

const ray=new THREE.Raycaster();
function pick(cx,cy){
  const m=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
  ray.setFromCamera(m,camera);
  for(const s of sats){if(ray.intersectObject(s.hit,false).length)return{sat:s};}
  for(const st of stars){if(ray.intersectObject(st.hit,false).length)return{star:st};}
  return null;
}
canvas.addEventListener('dblclick',e=>{
  const hit=pick(e.clientX,e.clientY);
  if(hit&&hit.sat){follow=hit.sat;flyTo(BLUE_POS,420);frozen=true;}
  else if(hit&&hit.star){follow=null;flyTo(hit.star.pos,hit.star.b.blue?900:170);}
  else{follow=null;flyTo(new THREE.Vector3(0,0,0),4200);}
});
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){follow=null;flyTo(new THREE.Vector3(0,0,0),4200);rotX=0.38;rotY=0.9;}});

const tip=document.getElementById('tip'),card=document.getElementById('card');
canvas.addEventListener('click',e=>{
  if(moved>6)return;
  const hit=pick(e.clientX,e.clientY);
  if(!hit){card.style.display='none';return;}
  frozen=true;
  if(hit.sat){const s=hit.sat;card.innerHTML=`<h4>🛰️ ${s.name}</h4><div class="sub">agent Bit · 互動 ${s.g} bits</div><div>${s.desc}</div><div style="color:#7fa88f;font-size:11px;margin-top:6px">軌道半徑 ${Math.round(s.r)} · 週期 ${(2*Math.PI/s.w).toFixed(0)}s<br>❄ 已凍結——橫向拖曳恢復</div>`;}
  else{const st=hit.star;card.innerHTML=`<h4>⭐ ${st.b.id}</h4><div class="sub">S.D. Day ${st.b.sd} · n=${st.b.n}</div><div>${st.b.label}${st.b.blue?'<br><b style="color:#ffe9a3">★ Blue 星系——飛近看展開</b>':''}</div><div style="color:#7fa88f;font-size:11px;margin-top:6px">hash ${st.b.hash}… · r=${Math.round(R0*Math.sqrt(st.b.n))}<br>❄ 已凍結——橫向拖曳恢復</div>`;}
  card.style.display='block';
});
canvas.addEventListener('mousemove',e=>{
  const hit=pick(e.clientX,e.clientY);
  if(hit){tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+10)+'px';
    tip.textContent=hit.sat?hit.sat.name:hit.star.b.id+' '+hit.star.b.label;}
  else tip.style.display='none';
});

/* ══════ 主循環：LOD＋軌道 ══════ */
const fpsEl=document.getElementById('fps'),lodEl=document.getElementById('lod');
let frames=0,fT=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(t-lastFrame)/1000);lastFrame=t;
  if(!frozen)simTime+=dt;
  const time=simTime;
  if(flyAnim){
    const k=Math.min(1,(t-flyAnim.t0)/flyAnim.dur),e=1-Math.pow(1-k,3);
    target.lerpVectors(flyAnim.fromT,flyAnim.toT,e);
    dist=flyAnim.fromD+(flyAnim.toD-flyAnim.fromD)*e;
    if(k>=1)flyAnim=null;
  }
  if(!dragging){rotY+=vx;rotX=Math.max(-1.4,Math.min(1.4,rotX+vy));vx*=0.95;vy*=0.95;}
  if(!frozen)rotY+=0.0004*60*dt;

  /* ★ LOD：相機與 Blue 星的距離決定星系展開程度 */
  const camDist = camera.position.distanceTo(BLUE_POS);
  const unfold = THREE.MathUtils.clamp(1-(camDist-900)/2200, 0, 1);   // 3100→0（純宇宙） 900→1（全展開）
  const globalA = 0.12+0.88*unfold;
  blueSys.visible = unfold>0.01;
  for(const s of sats){
    if(blueSys.visible){
      const a=s.phase0+time*s.w;
      const x=Math.cos(a)*s.r, z=Math.sin(a)*s.r*Math.cos(s.tilt), y=-Math.sin(a)*s.r*Math.sin(s.tilt);
      s.grp.position.set(x,y,z);
      const D=Math.hypot(x,y,z),dir=new THREE.Vector3(x/D,y/D,z/D);
      const inner=210,outer=Math.max(inner+40,D-32);
      const lp=s.line.geometry.attributes.position;
      lp.setXYZ(0,dir.x*inner,dir.y*inner,dir.z*inner);lp.setXYZ(1,dir.x*outer,dir.y*outer,dir.z*outer);lp.needsUpdate=true;
      s.pMeta.forEach((p,i)=>{
        const tt=((p.t+time*p.sp)%1);
        const wob=Math.sin(time*2+p.wob)*p.amp;
        s.pPos[i*3]=dir.x*(inner+(outer-inner)*tt)+Math.cos(time*1.7+p.wob*3)*wob*0.4;
        s.pPos[i*3+1]=dir.y*(inner+(outer-inner)*tt)+wob;
        s.pPos[i*3+2]=dir.z*(inner+(outer-inner)*tt)+Math.sin(time*1.3+p.wob*2)*wob*0.4;
      });
      s.pGeo.attributes.position.needsUpdate=true;
    }
    [s.core,s.orbit,s.line,s.particles].forEach(o=>{o.traverse?o.traverse(c=>{if(c.material)c.material.transparent=true}):0;});
    s.orbit.material.opacity=.55*globalA;
    s.line.material.opacity=.5*globalA;
    s.particles.material.opacity=.95*globalA;
    s.core.material.color.setHex(s.color);
    s.core.visible=globalA>0.05;
    s.core.scale.setScalar(Math.max(0.001,globalA));
  }
  if(!frozen){sysRing.rotation.z=time*0.08;}
  lodEl.textContent = unfold>0.6?'🔭 星系層（全展開）':unfold>0.15?'🌌 展開中…':'✨ 宇宙層（bits＋金線）';
  updateCam();renderer.render(scene,camera);
  frames++;if(t-fT>1000){fpsEl.textContent=(frozen?'❄ ':'')+frames+' fps';frames=0;fT=t;}
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
renderer.setSize(innerWidth,innerHeight);
requestAnimationFrame(loop);
</script>
</body>
</html>
